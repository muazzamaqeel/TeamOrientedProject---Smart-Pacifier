syntax = "proto3";

package myservice;

import "google/protobuf/empty.proto";
import "sensor_data.proto";

service MyService {
  rpc PublishIMU(stream Protos.IMUData) returns (google.protobuf.Empty);
  rpc PublishPT(stream Protos.PTData) returns (google.protobuf.Empty);
  rpc PublishAirflow(stream Protos.AIRFLOWData) returns (google.protobuf.Empty);
}